<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUSHEEL_BIRTHDAY.EXE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A1A;
    --bg2:#150E2E;
    --panel:#1A1330;
    --cyan:#2CF3FF;
    --magenta:#FF2CDF;
    --yellow:#FFE94A;
    --green:#3CFF7A;
    --purple:#9B5CFF;
    --ink:#EDEBFF;
    --ink-soft:#A79ED6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(155,92,255,.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(44,243,255,.18), transparent 45%),
      var(--bg);
    font-family:'VT323',monospace;
    color:var(--ink);
    overflow-x:hidden;
    touch-action:manipulation;
  }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:20px;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 2px, transparent 4px);
    pointer-events:none;
    z-index:70;
  }
  canvas#confetti{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:60;
  }
  .grid-floor{
    position:fixed;left:0;right:0;bottom:0;height:40vh;
    background-image:linear-gradient(rgba(44,243,255,.25) 1px, transparent 1px), linear-gradient(90deg, rgba(44,243,255,.25) 1px, transparent 1px);
    background-size:44px 44px;
    transform:perspective(300px) rotateX(60deg);
    transform-origin:bottom;
    opacity:.35;z-index:0;pointer-events:none;
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star{position:absolute;width:3px;height:3px;background:var(--ink);opacity:.6;animation:twinkle 2.4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.2;}50%{opacity:.9;}}

  .stage{position:relative;z-index:2;width:100%;max-width:560px;}

  .card{
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:3px solid var(--cyan);
    border-radius:12px;
    padding:36px 26px;
    text-align:center;
    box-shadow:0 0 0 4px var(--bg), 0 0 0 6px var(--magenta), 0 0 40px rgba(44,243,255,.35);
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

  .eyebrow{
    display:inline-block;
    font-family:'Press Start 2P',monospace;
    font-size:10px;letter-spacing:.08em;color:var(--bg);
    background:var(--yellow);padding:8px 14px;margin:0 0 18px;
    box-shadow:3px 3px 0 var(--magenta);
  }
  h1{
    font-family:'Press Start 2P',monospace;font-weight:400;font-size:19px;line-height:1.6;
    margin:0 0 14px;color:var(--cyan);
    text-shadow:0 0 10px rgba(44,243,255,.7), 2px 2px 0 var(--magenta);
  }
  p.sub{font-family:'VT323',monospace;font-size:22px;color:var(--ink-soft);margin:0 0 24px;line-height:1.4;}

  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;min-height:70px;}

  button{
    font-family:'Press Start 2P',monospace;font-size:11px;padding:14px 18px;border-radius:6px;
    border:2px solid var(--ink);cursor:pointer;background:var(--bg2);color:var(--ink);
    transition:transform .18s ease, box-shadow .18s ease;box-shadow:4px 4px 0 var(--purple);
    touch-action:manipulation;
  }
  button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--purple);}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--purple);}
  .btn-yes{background:var(--green);color:var(--bg);box-shadow:4px 4px 0 #128a3d;text-shadow:none;}
  .btn-yes:hover{box-shadow:6px 6px 0 #128a3d;}
  .btn-no{background:var(--bg2);border:2px solid var(--magenta);color:var(--magenta);position:relative;transition:transform .18s cubic-bezier(.34,1.56,.64,1);}

  .progress{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--yellow);margin-bottom:20px;letter-spacing:.05em;}
  .progress .bar{display:flex;gap:4px;justify-content:center;margin-top:10px;}
  .seg{width:22px;height:8px;background:#2b2350;border:1px solid var(--purple);}
  .seg.done{background:var(--green);}
  .seg.active{background:var(--yellow);animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:.3;}}

  .funny-msg{
    font-family:'VT323',monospace;font-size:19px;color:var(--magenta);
    margin-top:16px;min-height:24px;
    text-shadow:0 0 8px rgba(255,44,223,.5);
  }

  .signature{font-family:'VT323',monospace;color:var(--cyan);margin-top:22px;font-size:20px;}
  .score{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--yellow);margin-top:16px;text-shadow:2px 2px 0 var(--magenta);}

  .skip-link{
    display:inline-block;margin-top:16px;font-family:'VT323',monospace;font-size:16px;
    color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;
    box-shadow:none;padding:4px;
  }
  .skip-link:hover{transform:none;box-shadow:none;color:var(--cyan);}

  .game-wrap{
    position:relative;border:2px solid var(--purple);border-radius:8px;overflow:hidden;
    background:linear-gradient(180deg,#100a26,#1c1240);touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #runnerCanvas{display:block;width:100%;height:auto;touch-action:none;pointer-events:none;}
  .tap-zone{
    position:absolute;inset:0;z-index:5;
    touch-action:none;-webkit-user-select:none;user-select:none;
    cursor:pointer;
  }
  .game-hud{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--yellow);margin-bottom:14px;display:flex;justify-content:space-between;}
  .game-hint{font-family:'VT323',monospace;font-size:18px;color:var(--ink-soft);margin-top:14px;}
  .ready-overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(11,10,26,.55);
    font-family:'Press Start 2P',monospace;font-size:12px;color:var(--yellow);
    text-align:center;padding:16px;
    animation:blink 1.3s step-end infinite;
    z-index:10;pointer-events:none;
  }

  /* Gift box */
  .gift-scene{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .gift-box{font-size:80px;cursor:pointer;animation:wiggle 1.6s ease-in-out infinite;user-select:none;}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  .gift-tap-hint{font-family:'VT323',monospace;font-size:18px;color:var(--yellow);margin-top:6px;}
  .photo-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .photo-slot{
    position:relative;border-radius:10px;overflow:hidden;
    border:2px solid var(--purple);background:var(--bg2);
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  }
  .photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-fallback{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--ink-soft);font-family:'VT323',monospace;font-size:15px;padding:8px;text-align:center;
  }
  .photo-fallback .icon{font-size:26px;}

  /* Envelope / Letter */
  .envelope{font-size:80px;cursor:pointer;animation:wiggle 1.8s ease-in-out infinite;user-select:none;}
  .letter-text{
    font-family:'VT323',monospace;font-size:21px;color:var(--ink);
    white-space:pre-line;line-height:1.5;text-align:left;
    background:var(--bg2);border:2px solid var(--purple);border-radius:10px;
    padding:20px;margin:18px 0;animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }

  /* Cake scene */
  .cake-scene{position:relative;padding-top:10px;}
  .cake-emoji{font-size:70px;display:inline-block;animation:cakeBounce 2s ease-in-out infinite;}
  @keyframes cakeBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .flames{display:flex;justify-content:center;gap:14px;margin-bottom:-10px;}
  .flame{font-size:20px;animation:flicker .4s ease-in-out infinite alternate;}
  @keyframes flicker{
    0%{transform:scale(1) rotate(-3deg);opacity:.9;}
    100%{transform:scale(1.15) rotate(3deg);opacity:1;}
  }
  .sparkle-layer{position:absolute;inset:-10px;pointer-events:none;}
  .sparkle{position:absolute;font-size:16px;animation:sparklePop 1.8s ease-in-out infinite;}
  @keyframes sparklePop{0%,100%{opacity:0;transform:scale(.6);}50%{opacity:1;transform:scale(1.1);}}

  .hidden{display:none !important;}

  @media (max-width:480px){
    .card{padding:28px 16px;}
    h1{font-size:15px;}
    p.sub{font-size:19px;}
    button{font-size:9.5px;padding:12px 13px;}
    .gift-box, .envelope{font-size:64px;}
  }
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    button{transition:none;}
    .seg.active{animation:none;}
    .star{animation:none;}
    .gift-box,.envelope,.cake-emoji,.flame,.sparkle{animation:none;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<canvas id="confetti"></canvas>

<div class="stage" id="stage"></div>

`Susheel,

I don't say this enough, so I'm putting it in writing where you can't interrupt me.

You've shown up for me more times than I can count, in ways I probably haven't even thanked you for properly. The late-night calls, the stupid plans you went along with anyway, the way you somehow make hard days feel lighter just by being around — none of that goes unnoticed.

Knowing you has changed my life in small, quiet ways that add up to something huge. I'm genuinely grateful the timeline worked out so our paths crossed.

So today, I just want you to feel celebrated. You deserve every bit of it.

Here's to another year of showing up for each other.

Always,
Me`;

/* =========================================================
   WRONG-ANSWER MESSAGES MODULE (rotates, no back-to-back repeats)
   ========================================================= */
const WrongMessages = (() => {
  const pool = [
    "Ouch... that hurt! 💔",
    "Do you even have a heart? 😭",
    "Why would you choose that? 🥺",
    "Seriously? That wasn't very nice 😢",
    "I trusted you... and you clicked THAT? 😭",
    "Are you trying to make me cry? 💔",
    "That choice hurts my feelings 😔",
    "Nooo! Please give me another chance 🥹"
  ];
  let queue = [];
  let last = null;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function refill(){
    let next = shuffle(pool);
    if(next[0] === last && next.length > 1){
      [next[0], next[1]] = [next[1], next[0]];
    }
    queue = next;
  }
  function next(){
    if(queue.length === 0) refill();
    const msg = queue.shift();
    last = msg;
    return msg;
  }
  return { next };
})();

/* =========================================================
   OBSTACLES MODULE
   ========================================================= */
const Obstacles = (() => {
  const types = ["spike", "block", "roll", "gap"];

  function spawn(canvas, playerSize){
    const type = types[Math.floor(Math.random()*types.length)];
    const base = playerSize();
    let size;
    if(type === "spike") size = base * 0.55;
    else if(type === "block") size = base * 0.8;
    else if(type === "roll") size = base * 0.6;
    else size = base * 0.7; // gap
    return { type, x: canvas.width + size, size, spin:0 };
  }

  function update(o, dx, dt){
    o.x -= dx;
    if(o.type === "roll") o.spin += dt * 0.01;
  }

  function draw(ctx, o, groundY){
    const oy = groundY() - o.size;
    ctx.save();
    if(o.type === "spike"){
      ctx.font = o.size + "px serif";
      ctx.textAlign = "center";
      ctx.fillText("🔺", o.x + o.size/2, groundY() + o.size*0.05);
    } else if(o.type === "block"){
      ctx.font = o.size + "px serif";
      ctx.textAlign = "center";
      ctx.fillText("🧱", o.x + o.size/2, groundY() + o.size*0.05);
    } else if(o.type === "roll"){
      ctx.translate(o.x + o.size/2, groundY() - o.size/2);
      ctx.rotate(o.spin);
      ctx.font = o.size + "px serif";
      ctx.textAlign = "center";
      ctx.fillText("🟠", 0, o.size*0.35);
    } else if(o.type === "gap"){
      ctx.fillStyle = "#0B0A1A";
      ctx.fillRect(o.x, groundY(), o.size*1.4, 30);
      ctx.font = (o.size*0.6) + "px serif";
      ctx.textAlign = "center";
      ctx.fillText("⚡", o.x + o.size*0.7, groundY() + 20);
    }
    ctx.restore();
    return oy;
  }

  function hitbox(o, groundY){
    return { ox: o.x, oy: groundY() - o.size, os: o.size * 0.7 };
  }

  return { spawn, update, draw, hitbox };
})();

/* small nudge dodge — not a full-screen teleport, plus optional callback */
function makeButtonDodge(btn, onAttempt){
  let dodgeCount = 0;
  const maxDodges = 10;
  let offsetX = 0, offsetY = 0;

  function dodge(){
    if(onAttempt) onAttempt();
    if(dodgeCount >= maxDodges) return;
    dodgeCount++;
    const rect = btn.getBoundingClientRect();
    const margin = 12;
    const distance = 55 + Math.random() * 45;
    const angle = Math.random() * Math.PI * 2;
    let dx = Math.cos(angle) * distance;
    let dy = Math.sin(angle) * distance;
    const newLeft = rect.left + dx;
    const newTop = rect.top + dy;
    if(newLeft < margin) dx += (margin - newLeft);
    if(newTop < margin) dy += (margin - newTop);
    if(newLeft + rect.width > window.innerWidth - margin) dx -= (newLeft + rect.width - (window.innerWidth - margin));
    if(newTop + rect.height > window.innerHeight - margin) dy -= (newTop + rect.height - (window.innerHeight - margin));
    offsetX += dx; offsetY += dy;
    btn.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  }
  btn.addEventListener("pointerenter", dodge);
  btn.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(); }, {passive:false});
  btn.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, {passive:false});
  btn.addEventListener("click", (e) => { e.preventDefault(); dodge(); });
}

function renderGame(){

function initRunner(){
  const canvas = document.getElementById("runnerCanvas");
  const wrap = canvas.parentElement;
  const ctx = canvas.getContext("2d");
  const readyOverlay = document.getElementById("readyOverlay");

  function sizeCanvas(){
    const w = wrap.clientWidth;
    const h = Math.round(w * 0.5);
    canvas.width = w; canvas.height = h;
  }
  sizeCanvas();

  const groundY = () => canvas.height - 30;
  const playerX = () => canvas.width * 0.14;
  const playerSize = () => Math.max(30, canvas.width * 0.09);

  const state = {
    vy:0, y:0, jumping:false,
    obstacles:[], spawnTimer:1000,
    score:0, timeLeft:35,
    stopped:false, started:false,
    lastTs:null
  };
  runnerState = state;
  state.y = groundY() - playerSize();

  function jump(){
    if(state.stopped) return;
    if(!state.started){
      state.started = true;
      readyOverlay.classList.add("hidden");
    }
    if(!state.jumping){
      state.jumping = true;
      state.vy = -Math.max(11, canvas.height * 0.055);
    }
  }

  canvas.addEventListener("pointerdown", (e)=>{ e.preventDefault(); jump(); }, {passive:false});
  wrap.addEventListener("touchstart", (e)=>{ e.preventDefault(); jump(); }, {passive:false});
  const tapZone = document.getElementById("tapZone");
  if(tapZone){
    tapZone.addEventListener("touchstart", (e)=>{ e.preventDefault(); jump(); }, {passive:false});
    tapZone.addEventListener("pointerdown", (e)=>{ e.preventDefault(); jump(); }, {passive:false});
    tapZone.addEventListener("mousedown", (e)=>{ e.preventDefault(); jump(); });
    tapZone.addEventListener("click", (e)=>{ e.preventDefault(); jump(); });
  }
  const keyHandler = (e) => { if(e.code === "Space"){ e.preventDefault(); jump(); } };
  window.addEventListener("keydown", keyHandler);

  const timeEl = document.getElementById("gameTime");
  const scoreEl = document.getElementById("gameScore");

  function loop(ts){
    if(state.stopped) return;
    if(state.lastTs === null) state.lastTs = ts;
    const dt = Math.min(40, ts - state.lastTs);
    state.lastTs = ts;

    if(state.started){
      state.timeLeft -= dt/1000;
      if(state.timeLeft <= 0){ finishGame(); return; }
      timeEl.textContent = "TIME: " + Math.ceil(state.timeLeft);

      const gravity = canvas.height * 0.0022;
      if(state.jumping){
        state.vy += gravity;
        state.y += state.vy;
        const floor = groundY() - playerSize();
        if(state.y >= floor){ state.y = floor; state.jumping = false; state.vy = 0; }
      }

      state.spawnTimer -= dt;
      if(state.spawnTimer <= 0){
        state.obstacles.push(Obstacles.spawn(canvas, playerSize));
        state.spawnTimer = 1100 + Math.random()*900; // easy, spaced out
      }
      const speed = canvas.width * 0.22 * (dt/1000);
      state.obstacles.forEach(o => Obstacles.update(o, speed, dt));
      const passed = state.obstacles.filter(o => o.x + o.size < 0);
      if(passed.length){
        state.score += passed.length;
        scoreEl.textContent = "SCORE: " + state.score;
      }
      state.obstacles = state.obstacles.filter(o => o.x + o.size >= 0);

      const px = playerX(), py = state.y, ps = playerSize() * 0.7;
      let collided = false;
      state.obstacles.forEach(o => {
        const hb = Obstacles.hitbox(o, groundY);
        const hit = px < hb.ox + hb.os && px + ps > hb.ox && py < hb.oy + hb.os && py + ps > hb.oy;
        if(hit) collided = true;
      });
      if(collided){ gameOver(); return; }
    }

    draw(ctx, canvas, state, groundY, playerX, playerSize);
    requestAnimationFrame(loop);
  }

  function gameOver(){
    state.stopped = true;
    window.removeEventListener("keydown", keyHandler);
    stage.innerHTML = `
      <div class="card">
        <p class="eyebrow">💥 GAME OVER</p>
        <h1>OOF, GOT HIT!</h1>
        <p class="score">SCORE: ${state.score}</p>
        <p class="sub" style="margin-top:16px;">Total run time: ${(35 - state.timeLeft).toFixed(1)}s. Want another shot?</p>
        <div class="btn-row">
          <button class="btn-yes" id="retryGame">↻ TRY AGAIN</button>
        </div>
        <button class="skip-link" id="toGiftAfterOver">Continue to surprise →</button>
      </div>
    `;
    document.getElementById("retryGame").onclick = renderGame;
    document.getElementById("toGiftAfterOver").onclick = renderGift;
  }

  function finishGame(){
    state.stopped = true;
    window.removeEventListener("keydown", keyHandler);
    stage.innerHTML = `
      <div class="card">
        <p class="eyebrow">🏆 LEVEL CLEARED</p>
        <h1>BONUS ROUND COMPLETE</h1>
        <p class="score">SCORE: ${state.score}</p>
        <p class="sub" style="margin-top:16px;">Not bad for a birthday boy. Time for the actual surprise.</p>
        <button class="btn-yes" id="toGift">▶ CONTINUE</button>
      </div>
    `;
    document.getElementById("toGift").onclick = renderGift;
  }

  window.addEventListener("resize", () => { sizeCanvas(); });
  draw(ctx, canvas, state, groundY, playerX, playerSize);
  requestAnimationFrame(loop);
}

function draw(ctx, canvas, state, groundY, playerX, playerSize){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#2b2350";
  ctx.fillRect(0, groundY(), canvas.width, canvas.height - groundY());
  ctx.strokeStyle = "#2CF3FF";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY()); ctx.lineTo(canvas.width, groundY()); ctx.stroke();

  const ps = playerSize();
  ctx.font = ps + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("🎂", playerX() + ps/2, state.y + ps);

  state.obstacles.forEach(o => Obstacles.draw(ctx, o, groundY));
}

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resize);
resize();

const colors = ["#2CF3FF", "#FF2CDF", "#FFE94A", "#3CFF7A", "#9B5CFF"];
let particles = [];

function burstConfetti(){
  particles = [];
  const count = 150;
  for(let i=0;i<count;i++){
    particles.push({
      x: canvas.width/2, y: canvas.height/2,
      vx:(Math.random()-0.5)*14, vy:(Math.random()-1.4)*14,
      size:6+Math.random()*6, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360, vr:(Math.random()-0.5)*10, life:0
    });
  }
  requestAnimationFrame(animateConfetti);
}

function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let alive = false;
  particles.forEach(p => {
    p.life++; p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.rot += p.vr;
    if(p.life < 220 && p.y < canvas.height + 40){
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    }
  });
  if(alive) requestAnimationFrame(animateConfetti);
  else ctx.clearRect(0,0,canvas.width,canvas.height);
}
